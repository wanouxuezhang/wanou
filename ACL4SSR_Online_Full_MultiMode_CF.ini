[custom]
enable_rule_generator=true
overwrite_original_rules=true

; ====================== 策略组全部前置（核心解决proxy not found报错） ======================
custom_proxy_group=🛑 广告拦截,select,REJECT,DIRECT
custom_proxy_group=🎯 全球直连,select,DIRECT,🚀 节点选择,♻️ 自动选择
custom_proxy_group=📞 Google Voice,select,🇺🇸 美国节点,🚀 节点选择,♻️ 自动选择
custom_proxy_group=💳 PayPal分流,select,🇺🇸 美国节点,🚀 节点选择
custom_proxy_group=💰 Bybit交易所,select,🇺🇸 美国节点,🇸🇬 狮城节点,🚀 节点选择
custom_proxy_group=💰 Bitget交易所,select,🇺🇸 美国节点,🇸🇬 狮城节点,🚀 节点选择
custom_proxy_group=📈 币安服务,select,🇸🇬 狮城节点,🇺🇸 美国节点,🚀 节点选择
custom_proxy_group=🔮 Polymarket,select,🇺🇸 美国节点,🚀 节点选择
custom_proxy_group=💬 Ai平台,select,🇺🇸 美国节点,🇸🇬 狮城节点,🚀 节点选择
custom_proxy_group=🚀 节点选择,select,♻️ 自动选择,🇺🇸 美国节点,🇸🇬 狮城节点,🇭🇰 香港节点,******** 台湾节点,🇯🇵 日本节点,🇰🇷 韩国节点,📶 官方优选,☑️ 手动切换,DIRECT
custom_proxy_group=☑️ 手动切换,select,.*
custom_proxy_group=♻️ 自动选择,url-test,.*,http://www.gstatic.com/generate_204,300,,50
custom_proxy_group=🇺🇸 美国节点,url-test,(美|US|United States),http://www.gstatic.com/generate_204,300,,150
custom_proxy_group=🇸🇬 狮城节点,url-test,(新加坡|SG),http://www.gstatic.com/generate_204,300,,150
custom_proxy_group=🇭🇰 香港节点,url-test,(港|HK),http://www.gstatic.com/generate_204,300,,50
custom_proxy_group=******** 台湾节点,url-test,(台|TW),http://www.gstatic.com/generate_204,300,,80
custom_proxy_group=🇯🇵 日本节点,url-test,(日|JP),http://www.gstatic.com/generate_204,300,,100
custom_proxy_group=🇰🇷 韩国节点,url-test,(韩|KR),http://www.gstatic.com/generate_204,300,,100
custom_proxy_group=📶 官方优选,url-test,.*,http://www.gstatic.com/generate_204,200,,30
custom_proxy_group=🐟 漏网之鱼,select,🚀 节点选择,DIRECT

; ====================== 分流规则后置，每个交易所独立分组不合并 ======================
; 1.广告拦截（修复你弹窗报错的 admarvel 规则，分组名完全匹配）
ruleset=🛑 广告拦截,DOMAIN-KEYWORD,admarvel
ruleset=🛑 广告拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
ruleset=🛑 广告拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list
ruleset=🛑 广告拦截,DOMAIN-SUFFIX,ad
ruleset=🛑 广告拦截,DOMAIN-SUFFIX,advertisement

; 2.本地局域网、净化白名单
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list

; 3.Google Voice 接码
ruleset=📞 Google Voice,DOMAIN,voice.googleapis.com
ruleset=📞 Google Voice,DOMAIN,www.googleapis.com
ruleset=📞 Google Voice,DOMAIN-SUFFIX,googleapis.com
ruleset=📞 Google Voice,DOMAIN-KEYWORD,googlevoice
ruleset=📞 Google Voice,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/GoogleVoice/GoogleVoice.list
ruleset=📞 Google Voice,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Talkatone/Talkatone.list

; 4.PayPal 支付独立分组
ruleset=💳 PayPal分流,DOMAIN-SUFFIX,paypal.com
ruleset=💳 PayPal分流,DOMAIN-SUFFIX,paypal.me
ruleset=💳 PayPal分流,DOMAIN-SUFFIX,paypalobjects.com
ruleset=💳 PayPal分流,DOMAIN-KEYWORD,paypal

; 5.各交易所完全独立，不合并
ruleset=💰 Bybit交易所,DOMAIN-KEYWORD,bybit
ruleset=💰 Bybit交易所,DOMAIN-KEYWORD,byapps
ruleset=💰 Bybit交易所,DOMAIN-KEYWORD,bycsi
ruleset=💰 Bybit交易所,DOMAIN-SUFFIX,bytick.com

ruleset=💰 Bitget交易所,DOMAIN-KEYWORD,bitget
ruleset=💰 Bitget交易所,DOMAIN-KEYWORD,bitkeep

ruleset=📈 币安服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Binance.list

ruleset=🔮 Polymarket,DOMAIN-KEYWORD,polymarket
ruleset=🔮 Polymarket,DOMAIN-SUFFIX,polymarket.com

; 6.AI平台独立分组
ruleset=💬 Ai平台,DOMAIN-SUFFIX,anthropic.com
ruleset=💬 Ai平台,DOMAIN-SUFFIX,claude.ai
ruleset=💬 Ai平台,DOMAIN-KEYWORD,openai
ruleset=💬 Ai平台,DOMAIN,gemini.google.com
ruleset=💬 Ai平台,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/AI.list
ruleset=💬 Ai平台,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/OpenAi.list

